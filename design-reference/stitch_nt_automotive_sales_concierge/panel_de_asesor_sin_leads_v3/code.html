<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dashboard Asesor - Estado Vacío</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#f2ca50",
                        "inverse-primary": "#735c00",
                        "on-tertiary-fixed": "#00174b",
                        "surface-container-lowest": "#0e0e0e",
                        "on-primary-fixed": "#241a00",
                        "outline": "#99907c",
                        "surface-container-highest": "#353534",
                        "inverse-surface": "#e5e2e1",
                        "on-background": "#e5e2e1",
                        "error-container": "#93000a",
                        "secondary": "#46eaed",
                        "surface-container": "#201f1f",
                        "on-error": "#690005",
                        "secondary-fixed-dim": "#2ddbde",
                        "outline-variant": "#4d4635",
                        "surface-bright": "#393939",
                        "on-surface": "#e5e2e1",
                        "on-primary": "#3c2f00",
                        "on-secondary-fixed": "#002020",
                        "background": "#131313",
                        "secondary-fixed": "#5af8fb",
                        "surface-variant": "#353534",
                        "surface-container-low": "#1c1b1b",
                        "surface": "#131313",
                        "on-secondary-container": "#005253",
                        "secondary-container": "#00cdd0",
                        "tertiary": "#bfcdff",
                        "on-secondary-fixed-variant": "#004f51",
                        "tertiary-fixed-dim": "#b4c5ff",
                        "on-primary-fixed-variant": "#574500",
                        "on-tertiary": "#082b72",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed": "#dbe1ff",
                        "on-surface-variant": "#d0c5af",
                        "primary-fixed": "#ffe088",
                        "tertiary-container": "#97b0ff",
                        "surface-tint": "#e9c349",
                        "on-tertiary-fixed-variant": "#27438a",
                        "surface-dim": "#131313",
                        "on-primary-container": "#554300",
                        "surface-container-high": "#2a2a2a",
                        "error": "#ffb4ab",
                        "on-secondary": "#003738",
                        "primary-fixed-dim": "#e9c349",
                        "primary-container": "#d4af37",
                        "inverse-on-surface": "#313030",
                        "on-tertiary-container": "#254188"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xs": "4px",
                        "lg": "24px",
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "xl": "40px",
                        "unit": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-md-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "technical-label": ["JetBrains Mono"],
                        "body-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "technical-label": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        /* Thin, pulsing horizontal line (Electric Blue) */
        @keyframes pulse-line {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .ai-pulse-line {
            height: 1px;
            background-color: theme('colors.secondary');
            animation: pulse-line 2s infinite ease-in-out;
        }

        /* Technical Grid Background Pattern */
        .technical-grid {
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row antialiased">
<!-- Mobile Top App Bar (Hidden on md) -->
<header class="md:hidden flex justify-between items-center px-margin-mobile h-16 w-full z-50 bg-surface dark:bg-surface border-b border-outline-variant fixed top-0">
<div class="font-headline-md-mobile text-headline-md-mobile text-primary tracking-tighter">NT AUTOMOTIVE AGENT</div>
<div class="flex space-x-md">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer active:opacity-80">account_circle</span>
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer active:opacity-80">settings</span>
</div>
</header>
<!-- Desktop SideNavBar -->
<nav class="hidden md:flex flex-col py-lg space-y-md bg-surface-container dark:bg-surface-container h-full w-64 fixed left-0 top-0 border-r border-outline-variant z-50">
<div class="px-md mb-lg">
<h1 class="font-headline-sm text-headline-sm text-primary">NT Automotive Agent</h1>
<p class="font-technical-label text-technical-label text-on-surface-variant mt-sm">Authorized Agent</p>
</div>
<div class="flex flex-col w-full">
<a class="flex items-center px-md py-sm text-on-surface-variant hover:bg-surface-container-highest transition-all duration-200 ease-in-out w-full" href="#">
<span class="material-symbols-outlined mr-sm">smart_toy</span>
<span class="font-technical-label text-technical-label">Inicio</span>
</a>
<a class="flex items-center px-md py-sm text-primary border-l-2 border-primary bg-surface-container-high transition-all w-full" href="#">
<span class="material-symbols-outlined mr-sm">directions_car</span>
<span class="font-technical-label text-technical-label">Leads</span>
</a>
<a class="flex items-center px-md py-sm text-on-surface-variant hover:bg-surface-container-highest transition-all duration-200 ease-in-out w-full" href="#">
<span class="material-symbols-outlined mr-sm">build</span>
<span class="font-technical-label text-technical-label">Agenda</span>
</a>
<a class="flex items-center px-md py-sm text-on-surface-variant hover:bg-surface-container-highest transition-all duration-200 ease-in-out w-full" href="#">
<span class="material-symbols-outlined mr-sm">person</span>
<span class="font-technical-label text-technical-label">Perfil</span>
</a>
</div>
</nav>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col md:ml-64 mt-16 md:mt-0 p-margin-mobile md:p-margin-desktop technical-grid relative min-h-[calc(100vh-64px)] md:min-h-screen">
<!-- Desktop Header Area (Optional, for context) -->
<div class="hidden md:flex justify-between items-center w-full max-w-[1200px] mx-auto mb-xl">
<h2 class="font-headline-md text-headline-md text-on-surface">Panel de Asesor</h2>
<div class="flex space-x-md">
<span class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-colors cursor-pointer">account_circle</span>
<span class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-colors cursor-pointer">settings</span>
</div>
</div>
<!-- Empty State Container -->
<div class="flex-1 flex flex-col items-center justify-center w-full max-w-[1200px] mx-auto">
<div class="w-full max-w-lg bg-[#1E1E1E] border border-[#2A2A2A] rounded p-xl flex flex-col items-center text-center relative overflow-hidden group">
<!-- Subtle background accent inside card -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary opacity-5 rounded-full blur-3xl group-hover:opacity-10 transition-opacity duration-700"></div>
<!-- Abstract Technical Illustration (using CSS/Icons instead of heavy SVG data URIs) -->
<div class="relative w-32 h-32 mb-lg flex items-center justify-center">
<div class="absolute inset-0 border border-[#2A2A2A] rounded-full opacity-50"></div>
<div class="absolute inset-4 border border-[#2A2A2A] rounded-full border-dashed opacity-30 animate-[spin_20s_linear_infinite]"></div>
<span class="material-symbols-outlined text-[64px] text-outline-variant font-light" style="font-variation-settings: 'wght' 200;">satellite_alt</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-sm">No hay leads activos en este momento</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-xl max-w-sm">
                    Las nuevas consultas aparecerán aquí automáticamente.
                </p>
<button class="bg-primary hover:bg-primary-fixed text-on-primary font-technical-label text-technical-label px-lg py-sm rounded flex items-center transition-colors">
<span class="material-symbols-outlined mr-sm text-[18px]">refresh</span>
                    REFRESCAR PANEL
                </button>
<!-- AI Active Line Placeholder (Bottom of card) -->
<div class="absolute bottom-0 left-0 w-full ai-pulse-line"></div>
</div>
</div>
</main>
</body></html>
