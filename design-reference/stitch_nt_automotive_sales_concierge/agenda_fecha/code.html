<script>
        // Simple micro-interaction for date selection demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const dateButtons = document.querySelectorAll('.grid-cols-7 button:not([disabled])');
            
            dateButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Remove selected state from all
                    dateButtons.forEach(btn => {
                        btn.className = "font-technical-label text-technical-label text-on-surface py-sm rounded bg-surface-container hover:border-primary hover:text-primary border border-transparent transition-all focus:outline-none";
                    });
                    
                    // Add selected state to clicked
                    this.className = "font-technical-label text-technical-label text-on-primary py-sm rounded bg-primary border border-primary shadow-[0_0_10px_rgba(242,202,80,0.3)] focus:outline-none transition-all";
                    
                    // Update the summary strip (simulated)
                    const day = this.textContent.trim();
                    const summaryText = document.querySelector('.bg-surface-container-high .font-body-lg');
                    if(summaryText) {
                        summaryText.innerHTML = `Octubre ${day}, 2023`;
                        // Brief flash effect on text update
                        summaryText.style.opacity = '0.5';
                        setTimeout(() => summaryText.style.opacity = '1', 150);
                    }
                });
            });
        });
    </script>
